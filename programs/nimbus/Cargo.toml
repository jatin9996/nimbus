[package]
name = "nimbus"
version = "0.1.0"
edition = "2018"

[dependencies]
anchor-lang = "0.30.1"  
spl-token = "7.0.0"  
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anchor = { version = "0.0.1", optional = true } 

[features]
default = ["anchor"]

[patch.crates-io]
blake3 = { version = "1.5.0", features = ["digest"] }
